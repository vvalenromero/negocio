<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFS IA — Cámara simulada</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:white;font-family:system-ui,sans-serif}
header{background:#0f2e1f;padding:.6rem 1rem;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.view{position:relative;background:#111;overflow:hidden;aspect-ratio:16/9;max-width:900px;margin:0 auto;border:2px solid #1e3328;border-radius:12px}
.view video{width:100%;height:100%;object-fit:cover;display:block}
.box{position:absolute;border:2px solid #00ff88;box-shadow:0 0 10px #00ff88;background:rgba(0,255,136,.14);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.box::after{content:attr(data-label);position:absolute;top:-14px;left:0;background:#00ff88;color:#000;padding:1px 4px;border-radius:3px;font-size:.6rem;font-weight:700}
.hud{position:absolute;top:.6rem;left:.6rem;background:rgba(0,0,0,.75);padding:.4rem .6rem;border-radius:6px;font-size:.7rem}
.hud2{position:absolute;top:.6rem;right:.6rem;background:rgba(0,0,0,.75);padding:.4rem .6rem;border-radius:6px;font-size:.7rem;text-align:right}
.controls{max-width:900px;margin:.8rem auto;display:flex;gap:.6rem;justify-content:center}
.btn{padding:.6rem 1rem;border:none;border-radius:8px;font-weight:700;cursor:pointer}
.btn-on{background:#00ff88;color:#000}
.btn-off{background:#1e3328;color:#8aa89a}
</style>
</head>
<body>
<header><strong>EFS IA — Cámara simulada</strong><span style="color:#52b788">● YOLO en vuelo</span></header>
<div class="view" id="view">
<video id="video" autoplay muted loop playsinline poster="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1200&q=80" src="https://cdn.coverr.co/videos/coverr-aerial-view-of-a-green-field-1575/1080p.mp4?v=2"></video>
<div id="boxes"></div>
<div class="hud"><strong>IA: <span id="ia">ON</span></strong> · <span id="count">0 malezas</span><br>Conf: 88-94%</div>
<div class="hud2">Alt: 3.2m · Vel: 5.4 m/s<br>Pico: <span id="pico" style="color:#00ff88">AUTO</span></div>
</div>
<div class="controls">
<button class="btn btn-on" id="btn" onclick="toggle()">■ Pausar IA</button>
</div>
<p style="text-align:center;color:#8aa89a;font-size:.78rem;margin-top:.4rem">Cámara simulada — el dron vuela y la IA marca maleza en vivo. Así se vería en el T100 de EFS.</p>
<script>
let on=true;
const boxes=document.getElementById('boxes');
const countEl=document.getElementById('count');
function spawn(){
 if(!on) return;
 boxes.innerHTML="";
 const n=2+Math.floor(Math.random()*3);
 for(let i=0;i<n;i++){
  const d=document.createElement('div');
  d.className='box';
  d.style.left=(10+Math.random()*70)+'%';
  d.style.top=(20+Math.random()*50)+'%';
  d.style.width=(10+Math.random()*10)+'%';
  d.style.height=(12+Math.random()*12)+'%';
  d.setAttribute('data-label','maleza '+(88+Math.floor(Math.random()*7))+'%');
  boxes.appendChild(d);
 }
 countEl.textContent=n+" malezas";
 setTimeout(spawn, 900+Math.random()*800);
}
spawn();
function toggle(){
 on=!on;
 document.getElementById('btn').textContent= on ? "■ Pausar IA" : "▶ Activar IA";
 document.getElementById('ia').textContent= on ? "ON" : "PAUSA";
 if(on) spawn();
}
document.getElementById('video').addEventListener('error', ()=>{
 document.getElementById('video').postersrc="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1200&q=80";
});
</script>
</body>
</html>
